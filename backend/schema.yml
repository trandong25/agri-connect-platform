components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        recipient_name:
          type: string
          title: Tên người nhận
          maxLength: 250
        phone_number:
          type: string
          title: Số điện thoại
          pattern: ^(0|\+84)\d{9}$
          maxLength: 13
        province:
          type: string
          title: Thành Phố/Tỉnh
          maxLength: 150
        ward:
          type: string
          title: Xã
          maxLength: 150
        address_detail:
          type: string
          title: Địa chỉ chi tiết
          maxLength: 250
        is_default:
          type: boolean
          readOnly: true
          title: Địa chỉ mặc định
        created_date:
          type: string
          format: date-time
          readOnly: true
        updated_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_detail
      - created_date
      - id
      - is_default
      - phone_number
      - province
      - recipient_name
      - updated_date
      - ward
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Chờ duyệt
        * `APPROVED` - Đã duyệt
        * `REJECTED` - Từ chối
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        updated_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_date
      - id
      - items
      - updated_date
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          title: Sản phẩm
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Số lượng
        affiliate_code:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        updated_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_date
      - id
      - product
      - quantity
      - updated_date
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Tên danh mục
        description:
          type: string
          readOnly: true
      required:
      - description
      - id
      - name
    Farmer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farm_name:
          type: string
          title: Tên nông trại
          maxLength: 250
        address:
          type: string
          title: Địa chỉ
          maxLength: 255
        description:
          type: string
        verification_document:
          type: string
          nullable: true
          title: Giấy tờ xác minh
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        updated_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - approved_at
      - created_date
      - id
      - updated_date
    FarmerSellerOrder:
      type: object
      properties:
        id:
          type: integer

      - KOC
      type: string
      description: |-
        * `FARMER` - Nông dân
        * `CONSUMER` - Người tiêu dùng
        * `KOC` - KOC/KOL
    SellerOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer:
          type: integer
          readOnly: true
          title: Nông dân
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Tiền hàng
        shipping_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: Phí vận chuyển
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          title: Số tiền giảm
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Tổng tiền
        status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          readOnly: true
          title: Trạng thái
        note:
          type: string
          readOnly: true
          title: Ghi chú của nông dân
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Thời gian xác nhận
        shipped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Thời gian giao hàng
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Thời gian hoàn thành
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        status_logs:
          type: array
          items:
            $ref: '#/components/schemas/SellerOrderStatusLog'
          readOnly: true
        created_date:
          type: string
          format: date-time
          readOnly: true
        updated_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - confirmed_at
      - created_date
      - discount_amount
      - farmer
      - id
      - items
      - note
      - shipped_at
      - shipping_fee
      - status
      - status_logs
      - subtotal
      - total_amount
      - updated_date
    SellerOrderStatusLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        old_status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          readOnly: true
          title: Trạng thái cũ
        new_status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          readOnly: true
          title: Trạng thái mới
        changed_by:
          type: integer
          readOnly: true
          nullable: true
          title: Người thay đổi
        note:
          type: string
          readOnly: true
          title: Ghi chú
        created_date:
          type: string
          format: date-time
          readOnly: true
      required:
      - changed_by
      - created_date
      - id
      - new_status
      - note
      - old_status
    SellerOrderStatusUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SellerOrderStatusUpdateStatusEnum'
        note:
          type: string
      required:
      - status
    SellerOrderStatusUpdateStatusEnum:
      enum:
      - CONFIRMED
      - SHIPPING
      - COMPLETED
      type: string
      description: |-
        * `CONFIRMED` - CONFIRMED
        * `SHIPPING` - SHIPPING
        * `COMPLETED` - COMPLETED
    Status513Enum:
      enum:
      - DRAFT
      - PENDING
      - AVAILABLE
      - HIDDEN
      - REJECTED
      type: string
      description: |-
        * `DRAFT` - Bản nháp
        * `PENDING` - Chờ kiểm tra
        * `AVAILABLE` - Đang bán
        * `HIDDEN` - Đã ẩn
        * `REJECTED` - Không đạt yêu cầu
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Unit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Tên đơn vị
        symbol:
          type: string
          readOnly: true
      required:
      - id
      - name
      - symbol
    User:
      type: object
      properties:
        first_name:
          type: string
          title: Tên
          maxLength: 150
        last_name:
          type: string
          title: Họ
          maxLength: 150
        phone_number:
          nullable: true
          title: Số điện thoại
          oneOf:
          - type: string
            pattern: ^(0|\+84)\d{9}$
            maxLength: 12
          - type: string
            maxLength: 0
        avatar:
          type: string
          nullable: true
          title: Ảnh đại diện
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Tên đăng nhập
          description: Yêu cầu. 150 ký tự hoặc ít hơn. Chỉ là chữ cái, chữ số và @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Vai trò
        is_phone_verified:
          type: boolean
          readOnly: true
          title: Đã xác thực số điện thoại
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Ngày tham gia
      required:
      - date_joined
      - email
      - id
      - is_phone_verified
      - password
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
